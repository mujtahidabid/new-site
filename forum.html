<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop a Line — Forum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f2ede1;
    --paper:#eae3d2;
    --ink:#1b1918;
    --ink-soft:#4a463f;
    --red:#a3241f;
    --red-dim:#7d1c18;
    --line:#c9bfa8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--cream);
    background-image:
      radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size: 14px 14px;
    background-position: -7px -7px;
    color:var(--ink);
    font-family:'Archivo', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .sheet{
    width:100%;
    max-width:560px;
    background:var(--paper);
    border:1px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding:44px 40px 36px;
    position:relative;
  }

  .sheet::before{
    content:"";
    position:absolute;
    top:10px; left:10px; right:10px; bottom:10px;
    border:1px solid var(--line);
    pointer-events:none;
  }

  .kicker{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin:0 0 6px;
  }

  h1{
    font-weight:900;
    font-size:clamp(28px, 5vw, 38px);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  .lede{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:44ch;
    margin:0 0 32px;
  }

  form{ display:flex; flex-direction:column; gap:22px; }

  label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    margin-bottom:8px;
  }

  .hint{
    font-weight:400;
    color:var(--ink-soft);
    font-size:12px;
    margin-left:6px;
  }

  input[type="text"],
  textarea{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--ink);
    font-family:'Archivo', sans-serif;
    font-size:15.5px;
    color:var(--ink);
    padding:8px 2px;
    resize:vertical;
  }

  input[type="text"]::placeholder,
  textarea::placeholder{
    color:#8a8474;
    font-style:italic;
  }

  input[type="text"]:focus,
  textarea:focus{
    outline:none;
    border-bottom-color:var(--red);
  }

  textarea{ min-height:120px; line-height:1.5; }

  .attach-row{
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1.5px dashed var(--line);
    padding-bottom:10px;
  }

  .attach-btn{
    border:1px solid var(--ink);
    background:transparent;
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:8px 14px;
    cursor:pointer;
    color:var(--ink);
    white-space:nowrap;
  }

  .attach-btn:hover{ background:var(--ink); color:var(--cream); }

  #file-input{ display:none; }

  #file-name{
    font-size:12.5px;
    color:var(--ink-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    gap:16px;
  }

  .stamp{
    position:relative;
    border:2.5px solid var(--red);
    color:var(--red);
    background:transparent;
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:15px;
    letter-spacing:0.06em;
    padding:12px 28px;
    cursor:pointer;
    transform:rotate(-1.2deg);
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }

  .stamp:hover{ transform:rotate(-1.2deg) scale(1.03); }

  .stamp:active{
    background:var(--red);
    color:var(--cream);
  }

  .stamp:disabled{
    opacity:0.45;
    cursor:default;
    transform:none;
  }

  .status{
    font-size:12.5px;
    color:var(--ink-soft);
    min-height:16px;
    text-align:right;
  }

  .status.ok{ color:#2f5d3a; }
  .status.err{ color:var(--red); }

  .foot{
    margin-top:30px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }

  @media (prefers-reduced-motion: reduce){
    .stamp{ transition:none; }
  }

  @media (max-width:480px){
    .sheet{ padding:32px 22px 26px; }
    .actions{ flex-direction:column; align-items:stretch; gap:10px; }
    .status{ text-align:left; }
  }
</style>
</head>
<body>

<main class="sheet">
  <p class="kicker">FIELD NOTES — OPEN CHANNEL</p>
  <h1>Leave a line.</h1>
  <p class="lede">Anything written or attached here goes straight into the log. No account needed — sign it or don't.</p>

  <form id="drop-form">
    <div>
      <label for="alias">Alias <span class="hint">optional — a name, a tag, or nothing at all</span></label>
      <input type="text" id="alias" name="alias" placeholder="e.g. Wanderer #04, or leave blank" maxlength="60">
    </div>

    <div>
      <label for="message">Message <span class="hint">required</span></label>
      <textarea id="message" name="message" placeholder="Write what you came to say..." required maxlength="3800"></textarea>
    </div>

    <div>
      <label>Attachment <span class="hint">optional — one file, up to 20MB</span></label>
      <div class="attach-row">
        <button type="button" class="attach-btn" id="attach-btn">+ Add file</button>
        <span id="file-name">No file attached</span>
      </div>
      <input type="file" id="file-input" name="attachment">
    </div>

    <div class="actions">
      <button type="submit" class="stamp" id="submit-btn">SEND IT IN</button>
      <span class="status" id="status"></span>
    </div>
  </form>

  <div class="foot">
    <span>every entry is logged privately</span>
    <span id="charcount">0 / 3800</span>
  </div>
</main>

<script>
  // ---- CONFIGURE THIS ----
  // Paste the URL you get after deploying the Cloudflare Worker (see setup guide).
  // Example: "https://forum-relay.yourname.workers.dev"
  const RELAY_URL = "PASTE_YOUR_WORKER_URL_HERE";
  // -------------------------

  const form = document.getElementById('drop-form');
  const fileInput = document.getElementById('file-input');
  const attachBtn = document.getElementById('attach-btn');
  const fileName = document.getElementById('file-name');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');
  const messageEl = document.getElementById('message');
  const charcount = document.getElementById('charcount');

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      const f = fileInput.files[0];
      const sizeMB = (f.size / (1024 * 1024)).toFixed(1);
      fileName.textContent = `${f.name} (${sizeMB} MB)`;
    } else {
      fileName.textContent = 'No file attached';
    }
  });

  messageEl.addEventListener('input', () => {
    charcount.textContent = `${messageEl.value.length} / 3800`;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'status';

    const message = messageEl.value.trim();
    if (!message) {
      statusEl.textContent = 'A message is required.';
      statusEl.className = 'status err';
      return;
    }

    if (RELAY_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
      statusEl.textContent = 'Relay not configured yet — see setup guide.';
      statusEl.className = 'status err';
      return;
    }

    const data = new FormData();
    data.append('alias', document.getElementById('alias').value.trim());
    data.append('message', message);
    if (fileInput.files.length) {
      data.append('attachment', fileInput.files[0]);
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'SENDING...';
    statusEl.textContent = '';

    try {
      const res = await fetch(RELAY_URL, { method: 'POST', body: data });
      const result = await res.json();

      if (res.ok && result.ok) {
        statusEl.textContent = 'Sent — thank you.';
        statusEl.className = 'status ok';
        form.reset();
        fileName.textContent = 'No file attached';
        charcount.textContent = '0 / 3800';
      } else {
        throw new Error(result.error || 'Delivery failed.');
      }
    } catch (err) {
      statusEl.textContent = 'Could not send — try again.';
      statusEl.className = 'status err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'SEND IT IN';
    }
  });
</script>
</body>
</html>
